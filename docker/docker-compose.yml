
services:
  minio:
    image: minio/minio:latest
    container_name: detailpage-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

  renderer:
    image: node:18
    container_name: detailpage-renderer
    working_dir: /app
    volumes:
      - ./renderer:/app
    command: node server.js
    ports:
      - "3000:3000"
    restart: unless-stopped